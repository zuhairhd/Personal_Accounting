{% extends 'base.html' %}
{% block title %}{{ 'Edit' if rec else 'New' }} Reconciliation{% endblock %}
{% block page_title %}{{ 'Edit Reconciliation' if rec else 'New Bank Reconciliation' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="form-card">
      <form method="post">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Bank / Cash Account <span class="text-danger">*</span></label>
            <select name="account_id" class="form-select" required>
              <option value="">— Select Account —</option>
              {% for a in bank_accounts %}
              <option value="{{ a.id }}" {% if rec and rec.account_id == a.id %}selected{% endif %}>
                {{ a.code }} — {{ a.name }}
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Statement Date <span class="text-danger">*</span></label>
            <input type="date" name="statement_date" class="form-control"
                   value="{{ rec.statement_date.isoformat() if rec else today }}" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Book Balance (OMR)</label>
            <input name="book_balance" type="number" step="0.001" class="form-control text-end"
                   value="{{ '%.3f'|format(rec.book_balance|float) if rec else '0.000' }}">
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Bank Statement Balance (OMR)</label>
            <input name="statement_balance" type="number" step="0.001" class="form-control text-end"
                   value="{{ '%.3f'|format(rec.statement_balance|float) if rec else '0.000' }}">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Notes</label>
            <textarea name="notes" class="form-control" rows="3">{{ rec.notes if rec else '' }}</textarea>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg"></i> {{ 'Update' if rec else 'Save Reconciliation' }}
          </button>
          <a href="{{ url_for('bank_reconciliation') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
