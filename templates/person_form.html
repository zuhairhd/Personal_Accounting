{% extends 'base.html' %}
{% block title %}{{ 'Edit' if person else 'New' }} Person{% endblock %}
{% block page_title %}{{ 'Edit Person' if person else 'Add Person' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="form-card">
      <form method="post">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
            <input name="name" class="form-control" value="{{ person.name if person else '' }}" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Relationship / Category</label>
            <input name="relationship_or_category" class="form-control"
                   value="{{ person.relationship_or_category if person else '' }}"
                   placeholder="e.g. Family, Friend, Employer, Tenant…">
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Phone</label>
            <input name="phone" class="form-control" value="{{ person.phone if person else '' }}">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Email</label>
            <input name="email" type="email" class="form-control" value="{{ person.email if person else '' }}">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Notes</label>
            <textarea name="notes" class="form-control" rows="3">{{ person.notes if person else '' }}</textarea>
          </div>
          {% if person %}
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="is_active" value="1"
                     {% if person.is_active %}checked{% endif %} id="is_active">
              <label class="form-check-label" for="is_active">Active</label>
            </div>
          </div>
          {% endif %}
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg"></i> {{ 'Update' if person else 'Add Person' }}
          </button>
          <a href="{{ url_for('people') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
