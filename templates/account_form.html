{% extends 'base.html' %}
{% block title %}{{ 'Edit' if account else 'New' }} Account{% endblock %}
{% block page_title %}{{ 'Edit Account' if account else 'New Account' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="form-card">
      <form method="post">
        <div class="row g-3">
          <div class="col-sm-4">
            <label class="form-label fw-semibold">Account Code <span class="text-danger">*</span></label>
            <input name="code" class="form-control" value="{{ account.code if account else '' }}" placeholder="e.g. 1010">
          </div>
          <div class="col-sm-8">
            <label class="form-label fw-semibold">Account Name <span class="text-danger">*</span></label>
            <input name="name" class="form-control" value="{{ account.name if account else '' }}" placeholder="e.g. Cash with Zuhair">
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Account Type <span class="text-danger">*</span></label>
            <select name="account_type" class="form-select">
              {% for t in account_types %}
              <option value="{{ t }}" {% if account and account.account_type == t %}selected{% endif %}>{{ t }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Parent Account</label>
            <select name="parent_account_id" class="form-select">
              <option value="">— No parent —</option>
              {% for a in all_accounts %}
              <option value="{{ a.id }}" {% if account and account.parent_account_id == a.id %}selected{% endif %}>
                {{ a.code }} — {{ a.name }}
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="2">{{ account.description if account else '' }}</textarea>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="is_active" value="1"
                {% if not account or account.is_active %}checked{% endif %} id="is_active">
              <label class="form-check-label" for="is_active">Active</label>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg"></i> {{ 'Update Account' if account else 'Create Account' }}
          </button>
          <a href="{{ url_for('accounts') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
