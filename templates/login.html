<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Personal Finance Accounting Template</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .login-header {
      background: #1a6335;
      color: #fff;
      border-radius: 12px 12px 0 0;
      padding: 28px 32px 20px;
      text-align: center;
    }
    .login-header .app-icon {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }
    .login-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }
    .login-header p {
      font-size: 0.85rem;
      opacity: 0.80;
      margin: 4px 0 0;
    }
    .login-body {
      padding: 28px 32px 32px;
      background: #fff;
      border-radius: 0 0 12px 12px;
    }
    .form-label {
      font-weight: 500;
      font-size: 0.88rem;
    }
    .btn-login {
      background: #1a6335;
      border-color: #1a6335;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .btn-login:hover {
      background: #155228;
      border-color: #155228;
    }
    .error-box {
      background: #fff5f5;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 10px 14px;
      color: #721c24;
      font-size: 0.9rem;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-header">
      <div class="app-icon"><i class="bi bi-wallet2"></i></div>
      <h1>Personal Finance</h1>
      <p>Accounting Template</p>
    </div>
    <div class="login-body">
      {% if error %}
      <div class="error-box">
        <i class="bi bi-exclamation-circle me-1"></i> {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" name="username"
                 autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password"
                 autocomplete="current-password" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-login btn-primary btn-lg">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
